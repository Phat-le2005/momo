# FinResolve AI — local development stack (synthetic MOCK data only).
# Usage (from repo root):  docker compose -f infra/docker-compose.yml up --build
# Optional overrides: copy infra/.env.example to infra/.env (never commit .env).
name: finresolve

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finresolve}
      POSTGRES_USER: ${POSTGRES_USER:-finresolve}
      # Local-only sample password. Override via infra/.env for anything shared.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - finresolve_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finresolve}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-finresolve}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SOURCE_MODE: MOCK
      DEMO_APPROVAL_SECRET: ${DEMO_APPROVAL_SECRET:?DEMO_APPROVAL_SECRET must be set to a strong random >=32-char secret via environment or infra/.env}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      MODEL_BUDGET_TOKENS: ${MODEL_BUDGET_TOKENS:-20000}
      ENABLE_EMBEDDED_SUPERVISOR_WORKER: "false"
      AUTONOMOUS_RECOVERY_ENABLED: "false"
      COMMERCE_SERVICE_BASE_URL: ${COMMERCE_SERVICE_BASE_URL:-http://commerce-api:8100}
      COMMERCE_SERVICE_KEY: ${COMMERCE_SERVICE_API_KEY:?COMMERCE_SERVICE_API_KEY must be set to a strong >=32-char secret}
      COMMERCE_MERCHANT_ID: ${COMMERCE_MERCHANT_ID:-MERCHANT_FINSHOP_01}
      COMMERCE_SESSION_ID: ${COMMERCE_SESSION_ID:-CSESS_FINSHOP_DEFAULT_01}
      COMMERCE_WORLD_EPOCH: ${COMMERCE_WORLD_EPOCH:-1}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-25}
      SUPERVISOR_JOB_LEASE_SECONDS: ${SUPERVISOR_JOB_LEASE_SECONDS:-30}
      SUPERVISOR_HEARTBEAT_INTERVAL_SECONDS: ${SUPERVISOR_HEARTBEAT_INTERVAL_SECONDS:-5}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.supervisor.worker"]
    restart: unless-stopped
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finresolve}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-finresolve}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SOURCE_MODE: MOCK
      DEMO_APPROVAL_SECRET: ${DEMO_APPROVAL_SECRET:?DEMO_APPROVAL_SECRET must be set to a strong random >=32-char secret via environment or infra/.env}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      MODEL_BUDGET_TOKENS: ${MODEL_BUDGET_TOKENS:-20000}
      ENABLE_EMBEDDED_SUPERVISOR_WORKER: "false"
      AUTONOMOUS_RECOVERY_ENABLED: "true"
      COMMERCE_SERVICE_BASE_URL: ${COMMERCE_SERVICE_BASE_URL:-http://commerce-api:8100}
      COMMERCE_SERVICE_KEY: ${COMMERCE_SERVICE_API_KEY:?COMMERCE_SERVICE_API_KEY must be set to a strong >=32-char secret}
      COMMERCE_WRITE_KEY: ${COMMERCE_WRITE_KEY:?COMMERCE_WRITE_KEY must be set to a strong >=32-char secret}
      COMMAND_AUTH_SIGNING_SECRET: ${COMMAND_AUTH_SIGNING_SECRET:?COMMAND_AUTH_SIGNING_SECRET must be set to a strong >=32-char secret}
      COMMERCE_MERCHANT_ID: ${COMMERCE_MERCHANT_ID:-MERCHANT_FINSHOP_01}
      COMMERCE_SESSION_ID: ${COMMERCE_SESSION_ID:-CSESS_FINSHOP_DEFAULT_01}
      COMMERCE_WORLD_EPOCH: ${COMMERCE_WORLD_EPOCH:-1}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-25}
      SUPERVISOR_JOB_LEASE_SECONDS: ${SUPERVISOR_JOB_LEASE_SECONDS:-30}
      SUPERVISOR_HEARTBEAT_INTERVAL_SECONDS: ${SUPERVISOR_HEARTBEAT_INTERVAL_SECONDS:-5}
    depends_on:
      api:
        condition: service_healthy
      commerce-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; from app.db.session import get_sessionmaker; from app.supervisor.service import get_worker_health; m = get_sessionmaker(); db = m(); h = get_worker_health(db); db.close(); sys.exit(0 if h['worker_healthy'] else 1)"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

  monitor-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.monitoring.worker"]
    restart: unless-stopped
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finresolve}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-finresolve}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SOURCE_MODE: MOCK
      DEMO_APPROVAL_SECRET: ${DEMO_APPROVAL_SECRET:?DEMO_APPROVAL_SECRET must be set to a strong random >=32-char secret via environment or infra/.env}
      ENABLE_EMBEDDED_SUPERVISOR_WORKER: "false"
      AUTONOMOUS_RECOVERY_ENABLED: "false"
      CONTINUOUS_MONITOR_ENABLED: ${CONTINUOUS_MONITOR_ENABLED:-true}
      COMMERCE_SERVICE_BASE_URL: ${COMMERCE_SERVICE_BASE_URL:-http://commerce-api:8100}
      COMMERCE_SERVICE_KEY: ${COMMERCE_SERVICE_API_KEY:?COMMERCE_SERVICE_API_KEY must be set to a strong >=32-char secret}
      COMMERCE_WRITE_KEY: ${COMMERCE_WRITE_KEY:?COMMERCE_WRITE_KEY must be set to a strong >=32-char secret}
      COMMERCE_MERCHANT_ID: ${COMMERCE_MERCHANT_ID:-MERCHANT_FINSHOP_01}
      COMMERCE_SESSION_ID: ${COMMERCE_SESSION_ID:-CSESS_FINSHOP_DEFAULT_01}
      COMMERCE_WORLD_EPOCH: ${COMMERCE_WORLD_EPOCH:-1}
      MONITOR_POLL_INTERVAL_SECONDS: ${MONITOR_POLL_INTERVAL_SECONDS:-5}
      MONITOR_RECONCILE_INTERVAL_SECONDS: ${MONITOR_RECONCILE_INTERVAL_SECONDS:-15}
      MONITOR_BATCH_SIZE: ${MONITOR_BATCH_SIZE:-50}
      MONITOR_LEASE_SECONDS: ${MONITOR_LEASE_SECONDS:-30}
    depends_on:
      api:
        condition: service_healthy
      commerce-api:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # Browser-visible API URL (the browser runs on the host, not inside the network).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/demo > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  # --- Independent FinShop LIVE Commerce Stack (Prompt 10) ---
  commerce-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${COMMERCE_POSTGRES_DB:-finshop_commerce}
      POSTGRES_USER: ${COMMERCE_POSTGRES_USER:-finshop}
      POSTGRES_PASSWORD: ${COMMERCE_POSTGRES_PASSWORD:-change-me-commerce-local}
    ports:
      - "127.0.0.1:${COMMERCE_POSTGRES_PORT:-5434}:5432"
    volumes:
      - finshop_commerce_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  commerce-api:
    build:
      context: ../../MiniStore/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMMERCE_APP_ENV: docker
      COMMERCE_DATABASE_URL: postgresql+psycopg://${COMMERCE_POSTGRES_USER:-finshop}:${COMMERCE_POSTGRES_PASSWORD:-change-me-commerce-local}@commerce-db:5432/${COMMERCE_POSTGRES_DB:-finshop_commerce}
      COMMERCE_WEB_ORIGIN: ${COMMERCE_WEB_ORIGIN:-http://localhost:3100}
      COMMERCE_SOURCE_MODE: MOCK
      COMMERCE_AUTH_SECRET: ${COMMERCE_AUTH_SECRET:?COMMERCE_AUTH_SECRET must be set to a strong random >=32-char secret}
      COMMERCE_SERVICE_API_KEY: ${COMMERCE_SERVICE_API_KEY:?COMMERCE_SERVICE_API_KEY must be set to a strong random >=32-char secret}
      COMMERCE_RECOVERY_WRITE_ENABLED: "true"
      COMMERCE_SERVICE_WRITE_API_KEY: ${COMMERCE_WRITE_KEY:?COMMERCE_WRITE_KEY must be set to a strong >=32-char secret}
      COMMERCE_COMMAND_AUTH_SIGNING_SECRET: ${COMMAND_AUTH_SIGNING_SECRET:?COMMAND_AUTH_SIGNING_SECRET must be set to a strong >=32-char secret}
      COMMERCE_RECEIPT_STORAGE_DIR: /var/lib/finshop/private_receipts
      COMMERCE_MOCK_PROVIDER_SECRET: ${COMMERCE_MOCK_PROVIDER_SECRET:?COMMERCE_MOCK_PROVIDER_SECRET must be set to a strong random >=32-char secret}
      COMMERCE_TEST_MERCHANT_USERNAME: ${COMMERCE_TEST_MERCHANT_USERNAME:-merchant_owner}
      COMMERCE_TEST_MERCHANT_PASSWORD: ${COMMERCE_TEST_MERCHANT_PASSWORD:?COMMERCE_TEST_MERCHANT_PASSWORD must be set to a strong >=12-char password}
      COMMERCE_VNPAY_ENABLED: ${COMMERCE_VNPAY_ENABLED:-false}
      COMMERCE_VNPAY_TMN_CODE: ${COMMERCE_VNPAY_TMN_CODE:-}
      COMMERCE_VNPAY_HASH_SECRET: ${COMMERCE_VNPAY_HASH_SECRET:-}
      COMMERCE_VNPAY_RETURN_URL: ${COMMERCE_VNPAY_RETURN_URL:-http://localhost:3100/payment/vnpay/return}
      COMMERCE_VNPAY_IPN_PUBLIC_URL: ${COMMERCE_VNPAY_IPN_PUBLIC_URL:-}
      COMMERCE_VNPAY_REFUND_ENABLED: ${COMMERCE_VNPAY_REFUND_ENABLED:-false}
    ports:
      - "127.0.0.1:${COMMERCE_API_PORT:-8100}:8100"
    volumes:
      - finshop_private_receipts:/var/lib/finshop/private_receipts
    depends_on:
      commerce-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/readyz', timeout=4).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  commerce-worker:
    build:
      context: ../../MiniStore/backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      COMMERCE_APP_ENV: docker
      COMMERCE_DATABASE_URL: postgresql+psycopg://${COMMERCE_POSTGRES_USER:-finshop}:${COMMERCE_POSTGRES_PASSWORD:-change-me-commerce-local}@commerce-db:5432/${COMMERCE_POSTGRES_DB:-finshop_commerce}
      COMMERCE_WEB_ORIGIN: ${COMMERCE_WEB_ORIGIN:-http://localhost:3100}
      COMMERCE_SOURCE_MODE: MOCK
      COMMERCE_AUTH_SECRET: ${COMMERCE_AUTH_SECRET:?COMMERCE_AUTH_SECRET must be set to a strong random >=32-char secret}
      COMMERCE_SERVICE_API_KEY: ${COMMERCE_SERVICE_API_KEY:?COMMERCE_SERVICE_API_KEY must be set to a strong random >=32-char secret}
      COMMERCE_RECOVERY_WRITE_ENABLED: "false"
      COMMERCE_MOCK_PROVIDER_SECRET: ${COMMERCE_MOCK_PROVIDER_SECRET:?COMMERCE_MOCK_PROVIDER_SECRET must be set to a strong random >=32-char secret}
      COMMERCE_TEST_MERCHANT_USERNAME: ${COMMERCE_TEST_MERCHANT_USERNAME:-merchant_owner}
      COMMERCE_TEST_MERCHANT_PASSWORD: ${COMMERCE_TEST_MERCHANT_PASSWORD:?COMMERCE_TEST_MERCHANT_PASSWORD must be set to a strong >=12-char password}
      COMMERCE_VNPAY_ENABLED: ${COMMERCE_VNPAY_ENABLED:-false}
      COMMERCE_VNPAY_TMN_CODE: ${COMMERCE_VNPAY_TMN_CODE:-}
      COMMERCE_VNPAY_HASH_SECRET: ${COMMERCE_VNPAY_HASH_SECRET:-}
      COMMERCE_VNPAY_RETURN_URL: ${COMMERCE_VNPAY_RETURN_URL:-http://localhost:3100/payment/vnpay/return}
      COMMERCE_VNPAY_IPN_PUBLIC_URL: ${COMMERCE_VNPAY_IPN_PUBLIC_URL:-}
      COMMERCE_VNPAY_REFUND_ENABLED: ${COMMERCE_VNPAY_REFUND_ENABLED:-false}
    depends_on:
      commerce-api:
        condition: service_healthy

  commerce-web:
    build:
      context: ../../MiniStore/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_COMMERCE_API_BASE_URL: ${NEXT_PUBLIC_COMMERCE_API_BASE_URL:-http://localhost:8100}
    restart: unless-stopped
    ports:
      - "${COMMERCE_WEB_PORT:-3100}:3100"
    depends_on:
      commerce-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

volumes:
  finresolve_pgdata:
  finshop_commerce_pgdata:
  finshop_private_receipts:
